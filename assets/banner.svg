<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#161b3d"/>
      <stop offset="100%" stop-color="#2a0f3d"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58e1ff"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>

  <!-- neural network motif -->
  <g stroke="#58e1ff" stroke-opacity="0.18" stroke-width="1.2">
    <line x1="860" y1="60"  x2="960" y2="110"/><line x1="860" y1="60"  x2="960" y2="190"/>
    <line x1="860" y1="150" x2="960" y2="110"/><line x1="860" y1="150" x2="960" y2="190"/>
    <line x1="860" y1="240" x2="960" y2="110"/><line x1="860" y1="240" x2="960" y2="190"/>
    <line x1="960" y1="110" x2="1060" y2="80"/><line x1="960" y1="110" x2="1060" y2="150"/><line x1="960" y1="110" x2="1060" y2="220"/>
    <line x1="960" y1="190" x2="1060" y2="80"/><line x1="960" y1="190" x2="1060" y2="150"/><line x1="960" y1="190" x2="1060" y2="220"/>
    <line x1="1060" y1="80" x2="1140" y2="150"/><line x1="1060" y1="150" x2="1140" y2="150"/><line x1="1060" y1="220" x2="1140" y2="150"/>
  </g>
  <g fill="#58e1ff">
    <circle cx="860" cy="60" r="6"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="150" r="6"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="240" r="6"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#a78bfa">
    <circle cx="960" cy="110" r="7"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="190" r="7"><animate attributeName="opacity" values="1;0.4;1" dur="2s" begin="0.4s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#f472b6">
    <circle cx="1060" cy="80" r="6"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="1060" cy="150" r="6"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="1060" cy="220" r="6"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" begin="0.8s" repeatCount="indefinite"/></circle>
  </g>
  <circle cx="1140" cy="150" r="30" fill="url(#glow)"><animate attributeName="r" values="22;34;22" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="1140" cy="150" r="8" fill="#ffffff"/>

  <!-- signal pulse traveling through the net -->
  <circle r="4" fill="#ffffff">
    <animateMotion dur="3s" repeatCount="indefinite" path="M860,150 L960,110 L1060,150 L1140,150"/>
  </circle>

  <text x="70" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="url(#txt)">Murali Krishna G</text>
  <text x="72" y="178" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#c9d1d9">Machine Learning  ·  NLP &amp; LLMs  ·  Computer Vision  ·  Generative AI</text>
  <text x="72" y="222" font-family="Consolas, Menlo, monospace" font-size="18" fill="#8b949e">&gt; AI explorer · LLM tinkerer · end-to-end builder<tspan fill="#58e1ff">▌<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan></text>
</svg>
