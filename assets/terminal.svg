<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <style>
    .t { font-family: Consolas, 'Fira Code', Menlo, monospace; font-size: 17px; fill: #c9d1d9; }
    .p { fill: #58e1ff; } .c { fill: #f472b6; } .g { fill: #7ee787; } .m { fill: #a78bfa; } .d { fill: #8b949e; }
  </style>
  <rect width="900" height="400" rx="14" fill="#0d1117" stroke="#30363d"/>
  <rect width="900" height="38" rx="14" fill="#161b22"/>
  <rect y="24" width="900" height="14" fill="#161b22"/>
  <circle cx="24" cy="19" r="7" fill="#ff5f56"/><circle cx="48" cy="19" r="7" fill="#ffbd2e"/><circle cx="72" cy="19" r="7" fill="#27c93f"/>
  <text x="450" y="24" text-anchor="middle" class="t d" font-size="14">murali@ai-lab: ~</text>

  <g opacity="0"><set attributeName="opacity" to="1" begin="0.3s" fill="freeze"/>
    <text x="28" y="76" class="t"><tspan class="p">murali@ai-lab</tspan>:<tspan class="m">~</tspan>$ whoami</text></g>
  <g opacity="0"><set attributeName="opacity" to="1" begin="1.0s" fill="freeze"/>
    <text x="28" y="102" class="t">Murali Krishna — builds AI systems that learn, adapt &amp; make tasks smarter</text></g>

  <g opacity="0"><set attributeName="opacity" to="1" begin="1.8s" fill="freeze"/>
    <text x="28" y="140" class="t"><tspan class="p">murali@ai-lab</tspan>:<tspan class="m">~</tspan>$ cat focus.txt</text></g>
  <g opacity="0"><set attributeName="opacity" to="1" begin="2.4s" fill="freeze"/>
    <text x="28" y="166" class="t"><tspan class="c">▸</tspan> Machine Learning   <tspan class="c">▸</tspan> NLP &amp; LLMs   <tspan class="c">▸</tspan> Generative AI   <tspan class="c">▸</tspan> RAG</text></g>

  <g opacity="0"><set attributeName="opacity" to="1" begin="3.2s" fill="freeze"/>
    <text x="28" y="204" class="t"><tspan class="p">murali@ai-lab</tspan>:<tspan class="m">~</tspan>$ python train.py --model my_skills</text></g>
  <g opacity="0"><set attributeName="opacity" to="1" begin="3.8s" fill="freeze"/>
    <text x="28" y="230" class="t d">epoch 1/∞  loss: decreasing  curiosity: <tspan class="g">increasing ✔</tspan></text></g>

  <g opacity="0"><set attributeName="opacity" to="1" begin="4.6s" fill="freeze"/>
    <text x="28" y="268" class="t"><tspan class="p">murali@ai-lab</tspan>:<tspan class="m">~</tspan>$ ./robotics --status</text></g>
  <g opacity="0"><set attributeName="opacity" to="1" begin="5.2s" fill="freeze"/>
    <text x="28" y="294" class="t">🦾 <tspan class="m">status:</tspan> currently exploring</text></g>
  <g opacity="0"><set attributeName="opacity" to="1" begin="5.6s" fill="freeze"/>
    <text x="28" y="320" class="t d">[<tspan class="g">██</tspan>░░░░░░░░░░░░░░░░] exploring perception · planning · control</text>
    <rect x="66" y="306" width="0" height="18" fill="#7ee787" opacity="0.25">
      <animate attributeName="width" values="0;180;0" dur="4s" begin="5.6s" repeatCount="indefinite"/>
    </rect></g>

  <g opacity="0"><set attributeName="opacity" to="1" begin="6.4s" fill="freeze"/>
    <text x="28" y="358" class="t"><tspan class="p">murali@ai-lab</tspan>:<tspan class="m">~</tspan>$ <tspan class="p">▌<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan></text></g>
</svg>
