name: Drive the robot

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: robot
  cancel-in-progress: false

jobs:
  move:
    if: startsWith(github.event.issue.title, 'robot|')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Move robot
        env:
          TITLE: ${{ github.event.issue.title }}
          PLAYER: ${{ github.event.issue.user.login }}
        run: |
          CMD="${TITLE#robot|}"
          python3 robot/robot.py "$CMD" "$PLAYER"

      - name: Commit
        env:
          PLAYER: ${{ github.event.issue.user.login }}
        run: |
          git config user.name  "robot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md robot/state.json
          git commit -m "🤖 robot moved by @$PLAYER" || exit 0
          git pull --rebase
          git push

      - name: Reply & close issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number,
              body: `🤖 Beep boop! Thanks @${context.payload.issue.user.login}, the robot has moved. [See it on the profile](https://github.com/${context.repo.owner}).`
            });
            await github.rest.issues.update({
              ...context.repo, issue_number: context.issue.number, state: "closed"
            });
