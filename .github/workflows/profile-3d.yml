name: Update profile stats

on:
  push:
    branches: [main]
    paths-ignore:
      - "assets/stats.svg"
      - "robot/state.json"
  schedule:
    - cron: "30 18 * * *"   # daily, 00:00 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Stats card
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 stats/make_stats.py "${{ github.repository_owner }}"

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git diff --cached --quiet && exit 0
          git commit -m "📈 update profile stats"
          git pull --rebase
          git push
